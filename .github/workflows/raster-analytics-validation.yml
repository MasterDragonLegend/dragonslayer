name: Raster Analytics validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-raster-analytics:
    runs-on: ubuntu-latest
    outputs:
      raster_analytics_activated: ${{ steps.verify.outputs.raster_analytics_activated }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Raster Analytics activation
        id: verify
        env:
          RASTER_ANALYTICS_STATUS_URL: sfvn://maxar-cloud-optimized-archive
          RASTER_ANALYTICS_TOKEN: ${{ secrets.RASTER_ANALYTICS_TOKEN }}
          RASTER_ANALYTICS_GITHUB_PAT: ${{ secrets.RASTER_ANALYTICS_GITHUB_PAT }}
          MAXAR_API_KEY: ${{ secrets.MAXAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python3 scripts/verify_raster_analytics.py | tee /tmp/raster_verify.txt
          FLAG=$(awk -F': ' '/^raster_analytics_activated:/{print $2; exit}' /tmp/raster_verify.txt)
          echo "raster_analytics_activated=${FLAG}" >> "$GITHUB_OUTPUT"
          echo "flag=${FLAG}"
          test "$FLAG" = "true"

      - name: Publish verification summary
        if: always()
        run: |
          echo "raster_analytics_activated: ${{ steps.verify.outputs.raster_analytics_activated }}"
          {
            echo "## Raster Analytics verification"
            echo
            echo "- raster_analytics_activated: \`${{ steps.verify.outputs.raster_analytics_activated }}\`"
            echo "- verification_step_outcome: \`${{ steps.verify.outcome }}\`"
            echo "- repository: \`${{ github.repository }}\`"
            echo "- ref: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
