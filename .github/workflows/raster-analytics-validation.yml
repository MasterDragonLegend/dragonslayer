name: Raster Analytics validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-raster-analytics:
    runs-on: ubuntu-latest
    outputs:
      raster_analytics_activated: ${{ steps.verify.outputs.raster_analytics_activated }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Raster Analytics activation
        id: verify
        # Keep this non-fatal so the summary and explicit fail-closed gate below always run.
        continue-on-error: true
        env:
          # Required configuration:
          # - Repository variable: RASTER_ANALYTICS_STATUS_URL
          # - Repository or environment secret: RASTER_ANALYTICS_TOKEN
          # - Optional repository or environment secret: RASTER_ANALYTICS_GITHUB_PAT
          RASTER_ANALYTICS_STATUS_URL: ${{ vars.RASTER_ANALYTICS_STATUS_URL }}
          RASTER_ANALYTICS_TOKEN: ${{ secrets.RASTER_ANALYTICS_TOKEN }}
          RASTER_ANALYTICS_GITHUB_PAT: ${{ secrets.RASTER_ANALYTICS_GITHUB_PAT }}
        run: python3 scripts/verify_raster_analytics.py

      - name: Publish verification summary
        if: always()
        run: |
          echo "raster_analytics_activated: ${{ steps.verify.outputs.raster_analytics_activated }}"
          {
            echo "## Raster Analytics verification"
            echo
            echo "- raster_analytics_activated: \`${{ steps.verify.outputs.raster_analytics_activated }}\`"
            echo "- verification_step_outcome: \`${{ steps.verify.outcome }}\`"
            echo "- repository: \`${{ github.repository }}\`"
            echo "- ref: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require Raster Analytics activation
        if: always() && vars.RASTER_ANALYTICS_STATUS_URL != ''
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RASTER_ANALYTICS_ACTIVATED: ${{ steps.verify.outputs.raster_analytics_activated }}
        run: |
          if [ "$VERIFY_OUTCOME" != "success" ]; then
            echo "Raster Analytics verification did not complete successfully; inspect the previous step output."
            exit 1
          fi
          if [ "$RASTER_ANALYTICS_ACTIVATED" != "true" ]; then
            echo "Raster Analytics is not activated for ${GITHUB_REPOSITORY}."
            exit 1
          fi
